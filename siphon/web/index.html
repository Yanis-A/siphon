<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siphon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F4B740'/%3E%3Cg fill='none' stroke='%2318191F' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 6.5v13'/%3E%3Cpath d='m10.5 14.5 5.5 5.5 5.5-5.5'/%3E%3Cpath d='M9.5 25.5h13'/%3E%3C/g%3E%3C/svg%3E">
<style>
@font-face{font-family:"Archivo";font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;src:url(/fonts/archivo-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Archivo";font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;src:url(/fonts/archivo-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{
  --ink:#181B22;      /* page */
  --panel:#20242D;    /* surfaces */
  --raised:#292E39;   /* controls */
  --line:#343A48;     /* hairlines */
  --seg:#2C313C;      /* unlit meter segment */
  --text:#ECEEF2;
  --muted:#9097A7;
  --faint:#868D9C;    /* 4.7:1 sur --panel : seuil AA, ce ton porte du texte 12px */
  --amber:#F4B740;    /* signal */
  --amber-hi:#FFD27A;
  --on-amber:#1A1B20;
  --err:#FF7B6E;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --font:"Archivo","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--text);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:var(--r-sm)}
.i{width:18px;height:18px;flex:none;display:block}
.i.sm{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}

.wrap{max-width:760px;margin:0 auto;padding:28px 24px 72px}

/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:36px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 0;border-radius:var(--r-sm)}
.mark{width:28px;height:28px;border-radius:8px;background:var(--amber);color:var(--on-amber);display:grid;place-items:center}
.mark .i{width:18px;height:18px;stroke-width:2.4}
.word{font-weight:800;font-stretch:125%;font-size:19px;letter-spacing:.01em;line-height:1}
.top .spacer{flex:1}
.chip-status{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:5px 10px;border:1px solid var(--line);border-radius:999px}
.lang{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.lang button{font-size:12.5px;font-weight:600;padding:5px 9px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--raised);color:var(--text)}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--muted)}
.icon-btn:hover{background:var(--raised);color:var(--text)}

/* link input */
.deck{position:relative}
.field{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:6px 6px 6px 16px;transition:border-color .15s}
.field:focus-within{border-color:#4A5163}
.field .lead{color:var(--faint)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;padding:12px 4px;font-size:16px}
.field input::placeholder{color:var(--faint)}
.ghost{display:flex;align-items:center;gap:7px;height:40px;padding:0 12px;border-radius:var(--r-md);color:var(--muted);font-size:14px;font-weight:500}
.ghost:hover{background:var(--raised);color:var(--text)}
.go-btn{width:44px;height:44px;border-radius:var(--r-md);background:var(--amber);color:var(--on-amber);display:grid;place-items:center}
.go-btn:hover{background:var(--amber-hi)}
.go-btn:disabled{background:var(--raised);color:var(--faint)}
.drop .field{border-color:var(--amber);border-style:dashed}
.msg{margin:10px 2px 0;font-size:14px;color:var(--err);display:flex;gap:8px;align-items:flex-start}
.msg .i{margin-top:2px}
.msg small{display:block;color:var(--faint);font-size:12.5px;margin-top:2px;word-break:break-word}

/* preview + options */
.card{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.preview{display:grid;grid-template-columns:208px 1fr;gap:18px;padding:16px}
.thumb{aspect-ratio:16/9;border-radius:var(--r-md);overflow:hidden;background:var(--raised);display:grid;place-items:center;color:var(--faint);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pmeta{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
.ptitle{margin:0;font-size:17px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.psub{margin:0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.fact{font-size:12.5px;color:var(--muted);background:var(--raised);border-radius:var(--r-sm);padding:2px 8px;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.fact .i{width:14px;height:14px}
.skel{background:linear-gradient(90deg,var(--raised) 0 40%,#323846 50%,var(--raised) 60% 100%);background-size:250% 100%;animation:skel 1.3s linear infinite;border-radius:var(--r-sm)}
@keyframes skel{from{background-position:100% 0}to{background-position:-150% 0}}

.opts{border-top:1px solid var(--line);padding:16px;display:grid;gap:14px}
.tabs{display:inline-flex;background:var(--ink);border:1px solid var(--line);border-radius:var(--r-md);padding:3px;gap:2px;justify-self:start}
.tab{display:flex;align-items:center;gap:8px;padding:7px 16px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--raised);color:var(--text)}
.tab:disabled{opacity:.4}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{padding:7px 13px;border-radius:var(--r-sm);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.choice:hover{color:var(--text);border-color:#465063}
.choice[aria-checked="true"]{border-color:var(--amber);color:var(--text);box-shadow:inset 0 0 0 1px var(--amber)}
.choice .hint{color:var(--faint);font-weight:400;margin-left:4px}
.choice[aria-checked="true"] .hint{color:var(--muted)}
.row-label{font-size:13px;color:var(--faint);margin:0 0 6px}
.marks{list-style:none;margin:0;padding:9px 11px;max-height:228px;overflow:auto;background:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);display:grid;gap:4px}
.marks.flash{animation:flash 1.1s ease-out}
.marks li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;font-size:12.5px;min-width:0}
.marks .mno,.marks .mtime{color:var(--faint);font-variant-numeric:tabular-nums}
.marks .mname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl{height:48px;border-radius:var(--r-md);background:var(--amber);color:var(--on-amber);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px;transition:background .15s}
.dl:hover{background:var(--amber-hi)}
.dl:disabled{background:var(--raised);color:var(--muted)}
.dest{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--faint);min-width:0}
.dest .path{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left;min-width:0;flex:0 1 auto}
.link-btn{color:var(--muted);font-size:13px;font-weight:600;padding:2px 4px;border-radius:4px;white-space:nowrap}
.link-btn:hover{color:var(--text)}

/* downloads */
.dls{margin-top:40px}
.dls-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.dls-head h2{margin:0;font-size:15px;font-weight:700;flex:1}
.list{display:grid;gap:8px}
.job{display:grid;grid-template-columns:80px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 10px 10px 10px}
.job.flash{animation:flash 1.1s ease-out}
@keyframes flash{from{border-color:var(--amber)}to{border-color:var(--line)}}
.jthumb{width:80px;aspect-ratio:16/9;border-radius:var(--r-sm);overflow:hidden;background:var(--raised);display:grid;place-items:center;color:var(--faint)}
.jthumb img{width:100%;height:100%;object-fit:cover;display:block}
.jbody{min-width:0;display:grid;gap:5px}
.jtitle{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jline{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:13px;color:var(--muted);min-width:0;font-variant-numeric:tabular-nums}
.jline>*{white-space:nowrap}
.job.error .jline>.jstat{white-space:normal;flex:1 1 200px}
.badge{font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--text);background:var(--raised);padding:1px 7px;border-radius:4px;display:flex;align-items:center;gap:4px;flex:none}
.badge .i{width:13px;height:13px}
.jstat{display:flex;align-items:center;gap:6px;min-width:0}
.jstat .i{width:15px;height:15px}
.job.error .jstat{align-items:flex-start}
.job.error .jstat .i{margin-top:2px}
.jline .num{color:var(--text)}
.jline .dim{color:var(--faint)}
.job.done .jstat{color:var(--text)}
.job.done .jstat .i{color:var(--amber)}
.job.error .jstat{color:var(--err)}
.jdetail{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jact{display:flex;gap:2px}

/* the meter: segmented like a channel level meter */
.meter{--p:0;height:7px;position:relative;background:var(--seg);
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);
          mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px)}
.meter>i{position:absolute;inset:0 auto 0 0;width:calc(var(--p) * 1%);width:round(down,calc(var(--p) * 1%),7px);background:var(--amber);transition:width .3s linear}
.meter.work>i{width:100%;background:linear-gradient(90deg,var(--amber) 0 35%,var(--amber-hi) 50%,var(--amber) 65% 100%);background-size:300% 100%;animation:sweep 1.6s linear infinite}
.meter.wait>i{width:0}
@keyframes sweep{from{background-position:100% 0}to{background-position:-200% 0}}

/* waveform editor */
.editor{display:grid;gap:14px}
.ed-top{display:flex;align-items:center;gap:12px}
.ed-name{flex:1;min-width:0;margin:0;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-export{height:40px;padding:0 16px;flex:none}
.wavebox{position:relative;height:190px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.wavebox canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.wavebox.grabbing canvas{cursor:grabbing}
.ed-note{position:absolute;inset:0;margin:0;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:16px;pointer-events:none}
.ed-bar{display:flex;align-items:center;gap:10px}
.ed-bar .spacer{flex:1}
.ed-time{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ed-hint{font-size:12.5px;color:var(--faint);margin:-6px 0 0}
.ed-zoom{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.minimap{display:block;width:100%;height:34px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;touch-action:none}
.wavebox.resizing canvas{cursor:col-resize}
.wavebox.moving canvas{cursor:grabbing}
.wavebox.panning canvas{cursor:grab}
.ed-row .edur{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.ed-list{display:grid;gap:4px;max-height:320px;overflow:auto}
.ed-row{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 8px}
.ed-row.on{border-color:var(--amber)}
.ed-row .eno{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.ed-row .ets{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px}
.ed-row input{width:100%;min-width:0;background:none;border:0;outline:0;padding:5px 6px;border-radius:4px;font-size:13.5px}
.ed-row input:focus{background:var(--raised)}
.ed-row .acts{display:flex;gap:1px}
.ed-paste{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.ed-paste summary{cursor:pointer;font-size:13.5px;font-weight:600}
.ed-paste textarea{width:100%;margin:8px 0;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font:inherit;font-size:13px;resize:vertical}
.ed-paste .note{margin:8px 0 0}

/* popover */
.pop{position:absolute;right:0;top:44px;width:320px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;z-index:5;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.pop h3{margin:0 0 10px;font-size:14px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px;margin:0 0 14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.pop .note{font-size:12.5px;color:var(--faint);margin:10px 0 0}
.pop .note.err{color:var(--err)}
.pop .sep{height:1px;background:var(--line);margin:16px 0}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:38px;border-radius:var(--r-md);background:var(--raised);font-weight:600;font-size:14px}
.btn2:hover:not(:disabled){background:#333948}
.btn2:disabled{color:var(--faint)}
.destlist{display:grid;gap:6px}
.destrow{display:flex;align-items:center;gap:4px}
.destpick{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:baseline;text-align:left;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-sm)}
.destpick:hover{border-color:#465063}
.destrow.on .destpick{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.destpick .dname{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.destpick .dfmt{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.destpick .dpath{grid-column:1/-1;font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.top-right{position:relative;display:flex;align-items:center;gap:6px}

/* closed overlay */
.closed{position:fixed;inset:0;background:rgba(24,27,34,.94);display:grid;place-items:center;z-index:20;padding:24px}
.closed-box{max-width:360px;text-align:center}
.closed-box h2{margin:16px 0 6px;font-size:20px;font-weight:700}
.closed-box p{margin:0 0 20px;color:var(--muted)}
.closed-box .mark{margin:0 auto;width:44px;height:44px;border-radius:12px}
.closed-box .mark .i{width:26px;height:26px}
.closed-box .btn2{width:auto;padding:0 18px;display:inline-flex}

.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:600px){
  .wrap{padding:20px 16px 56px}
  .top{margin-bottom:24px}
  .preview{grid-template-columns:1fr;gap:12px}
  .thumb.empty{aspect-ratio:auto;height:64px}
  .job{grid-template-columns:56px 1fr auto;gap:10px}
  .jthumb{width:56px}
  .ghost .lbl{display:none}
  .pop{width:min(320px,calc(100vw - 32px))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="home" type="button">
      <span class="mark" data-icon="arrow-down-to-line"></span>
      <span class="word">Siphon</span>
    </button>
    <span class="spacer"></span>
    <div class="top-right">
      <span class="chip-status" id="engineChip" hidden><span data-icon="loader-circle" class="spin-wrap"></span><span data-t="engineUpdating"></span></span>
      <div class="lang" role="group" data-al="langGroup">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="fr">FR</button>
      </div>
      <button class="icon-btn" id="settingsBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings" data-title="settings"><span data-icon="settings-2"></span></button>
      <button class="icon-btn" id="quitBtn" type="button" data-title="quit"><span data-icon="power"></span></button>
      <div class="pop" id="settings" role="dialog" aria-labelledby="engineTitle" hidden>
        <h3 id="engineTitle" data-t="engine"></h3>
        <dl class="kv" id="versions"></dl>
        <button class="btn2" id="updateBtn" type="button"><span data-icon="refresh-cw"></span><span data-t="updateEngine"></span></button>
        <p class="note" id="engineNote"></p>
        <div class="sep"></div>
        <button class="choice" type="button" id="keepAlive" role="switch" aria-checked="false"
                style="width:100%;justify-content:center"><span data-t="keepAlive"></span></button>
        <p class="note" style="margin:8px 0 0" data-t="keepAliveHint"></p>
        <div class="sep"></div>
        <h3 data-t="destinations"></h3>
        <p class="note" style="margin:0 0 10px" data-t="destHint"></p>
        <div class="destlist" id="destList"></div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn2" type="button" data-action="add-destination"><span data-t="addDestination"></span></button>
          <button class="btn2" type="button" data-action="open-folder"><span data-t="openFolder"></span></button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <form class="deck" id="deck" autocomplete="off">
      <div class="field">
        <span class="lead" data-icon="link"></span>
        <input id="url" type="text" inputmode="url" spellcheck="false" data-ph="placeholder" data-al="linkLabel">
        <button class="ghost" id="clearBtn" type="button" hidden data-title="clear"><span data-icon="x"></span></button>
        <button class="ghost" id="pasteBtn" type="button"><span data-icon="clipboard-paste"></span><span class="lbl" data-t="paste"></span></button>
        <button class="go-btn" id="goBtn" type="submit" data-title="lookUp"><span data-icon="arrow-right"></span></button>
      </div>
      <div class="msg" id="fetchMsg" role="status" aria-live="polite" hidden></div>
    </form>

    <section class="card" id="card" hidden>
      <div class="preview" id="preview"></div>
      <div class="opts" id="opts"></div>
    </section>

    <section class="dls" id="dls" hidden>
      <div class="dls-head">
        <h2 data-t="downloads"></h2>
        <button class="link-btn" type="button" id="clearDone" hidden data-t="clearFinished"></button>
        <button class="icon-btn" type="button" data-action="open-folder" data-title="openFolder"><span data-icon="folder-open"></span></button>
      </div>
      <div class="list" id="list"></div>
    </section>

    <section class="editor" id="editor" hidden>
      <div class="ed-top">
        <button class="ghost" type="button" id="edBack"><span data-icon="arrow-left"></span><span class="lbl" data-t="back"></span></button>
        <h2 class="ed-name" id="edName"></h2>
        <button class="dl ed-export" type="button" id="edExport"></button>
      </div>
      <div class="wavebox" id="waveBox">
        <canvas id="wave"></canvas>
        <p class="ed-note" id="edNote"></p>
      </div>
      <canvas class="minimap" id="mini"></canvas>
      <div class="ed-bar">
        <button class="icon-btn" type="button" id="edPlay" data-title="play"></button>
        <button class="icon-btn" type="button" id="edLoop" data-title="loopTitle"></button>
        <span class="ed-time" id="edTime"></span>
        <span class="spacer"></span>
        <span class="ed-zoom" id="edZoom"></span>
        <button class="icon-btn" type="button" id="edOut" data-title="zoomOut"></button>

/* A signal that also fires on timeout, without relying on AbortSignal.any. */
function linkSignal(signal, ms) {

async function api(path, body, signal, timeout = TIMEOUT.default) {

      headers: { "Content-Type": "application/json", "X-Siphon": "1" }

$("#opts").addEventListener("click", e => {

/* ───────── polling ───────── */

    S.jobs = d.jobs; S.engine = d.engine || {}; S.misses = 0; fresh = true;
    if (S.offline) { S.offline = false; $("#closed").hidden = true; loadState(); }

  const rowsKv = [["yt-dlp", v.yt_dlp], ["EJS", v.ejs], [v.node && !v.deno ? "Node" : "Deno", v.deno || v.node], ["FFmpeg", v.ffmpeg]];
  $("#versions").innerHTML = rowsKv.map(([k, val]) => `<dt>${k}</dt><dd>${esc(val || "—")}</dd>`).join("");
  const upd = S.engine.status === "updating";
  const btn = $("#updateBtn");
  btn.disabled = upd;
  btn.innerHTML = `${icon("refresh-cw", upd ? "spin" : "")}<span>${esc(upd ? t().engineUpdating : t().updateEngine)}</span>`;
  const note = $("#engineNote");

}

/* `restore` is true when the user closed it deliberately (Escape, the toggle),

  $("#settingsBtn").setAttribute("aria-expanded", "false");

/* ───────── folder + global actions ───────── */
let choosing = false;
document.addEventListener("click", async e => {
  const a = e.target.closest("[data-action]"); if (!a) return;
  const action = a.dataset.action;
  // the picker is a native modal on the server side: a second click opens a second one
  const picks = action === "choose-folder" || action === "add-destination";
  if (picks && choosing) return;
  if (action === "find-tracklist" && (S.searching || !S.info)) return;
  const after = d => {
    if (d.destinations) S.dests = d.destinations;
    S.folder = activeDest()?.folder || d.folder || S.folder;
    if (S.info) renderOptions();
    renderSettings(); clearActionError();
  };
  try {
    if (picks) { choosing = true; a.disabled = true; }
    if (action === "open-folder") { await api("/api/folder/open", {}); clearActionError(); }
    // no deadline on the two below: they wait on a human in a native dialog
    if (action === "choose-folder") after(await api("/api/folder/choose", { title: t().folder }, undefined, TIMEOUT.none));
    if (action === "add-destination") after(await api("/api/destinations/add", { title: t().addDestination }, undefined, TIMEOUT.none));
    if (action === "remove-destination") after(await api("/api/destinations/remove", { id: a.dataset.id }));
    if (action === "find-tracklist") {
      const asked = S.url;
      S.searching = true; renderOptions();
      const d = await api("/api/tracklist", { url: S.info.url || S.url, duration: S.info.duration || 0 },
                          undefined, TIMEOUT.comments);
      if (S.info && S.url === asked) {        // the link may have changed while we read
        const found = d.source || {};
        if ((found.marks || []).length > 1) {
          // added beside what was already there, never on top of it
          S.info.sources = [...sources().filter(s => s.key !== "comments"), found];
          S.sourceKey = "comments"; S.split = true; S.flashMarks = true;
          clearActionError();
        } else {
          showActionError({ code: "no_tracklist" });
        }
      }
    }
  } catch (err) {
    if (!aborted(err)) showActionError(err);
  } finally {
    if (picks) { choosing = false; a.disabled = false; }
    if (action === "find-tracklist") { S.searching = false; if (S.info) renderOptions(); }
  }
});

const deck = $("#deck");
["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => { if ([...(e.dataTransfer?.types || [])].some(x => x === "text/uri-list" || x === "text/plain")) { e.preventDefault(); deck.classList.add("drop"); } }));

/* ───────── waveform editor ───────── */
/* Passages, not cut points. You drag across the wave and that span becomes one
   extract; everything you did not select is simply ignored. Boundary markers
   would force the whole file into adjacent tracks, which is not what pulling
   three good moments out of a two-hour set looks like.
   Dragging gives the rough span, the playhead and [ ] give the precision: at
   this zoom one pixel is several seconds, so the ear has to finish the job. */
const E = { job: null, coarse: [], fine: null, duration: 0, regions: [], view: { start: 0, end: 0 },
            cur: 0, playing: false, loop: false, playEnd: 0, sel: -1, drag: null };
let edAudio = null, edRaf = 0, fineTimer = 0, fineCtl = null;

const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#888";
const editorOpen = () => !$("#editor").hidden;
const fmtClock = s => fmtDur(Math.max(0, Math.round(s || 0))) || "0:00";
const RULER_H = 17, MIN_VIEW = 0.4;
const viewSpan = () => Math.max(0.001, E.view.end - E.view.start);

/* The whole file is traced once and kept; the visible window is traced again on
   demand, because zooming into a coarse trace only magnifies its pixels. The
   coarse one keeps drawing meanwhile, so zooming never blanks the screen. */
function peakAt(t) {
  const f = E.fine;
  if (f && f.peaks.length && t >= f.start && t <= f.end && f.end > f.start) {
    const i = Math.floor((t - f.start) / (f.end - f.start) * f.peaks.length);
    return f.peaks[Math.max(0, Math.min(f.peaks.length - 1, i))] || 0;
  }
  if (!E.coarse.length || !E.duration) return 0;
  const i = Math.floor((t / E.duration) * E.coarse.length);
  return E.coarse[Math.max(0, Math.min(E.coarse.length - 1, i))] || 0;
}

function setView(start, span) {
  span = Math.max(MIN_VIEW, Math.min(span, E.duration || span));
  start = Math.max(0, Math.min(start, (E.duration || span) - span));
  E.view = { start, end: start + span };
  requestFine();
  drawWave(); drawMini(); renderEdBar();
}

function zoomAt(clientX, factor) {
  if (!E.duration) return;
  const anchor = xToTime(clientX);
  const frac = (anchor - E.view.start) / viewSpan();
  const span = viewSpan() / factor;
  setView(anchor - frac * Math.max(MIN_VIEW, Math.min(span, E.duration)), span);
}

function requestFine() {
  clearTimeout(fineTimer);
  fineTimer = setTimeout(async () => {
    const job = E.job;
    if (!job || !E.duration) return;
    const { start, end } = E.view;
    if (end - start >= E.duration - 0.01) { E.fine = null; drawWave(); return; }
    fineCtl?.abort();
    fineCtl = new AbortController();
    try {
      const d = await api(`/api/jobs/${job.id}/peaks`, { start, end, buckets: 1600 },
                          fineCtl.signal, TIMEOUT.peaks);
      if (!editorOpen() || E.job?.id !== job.id) return;
      E.fine = { start: d.start, end: d.end, peaks: d.peaks || [] };
      drawWave();
    } catch (e) { if (!aborted(e)) console.error("peaks", e); }
  }, 170);
}

async function openEditor(job) {
  Object.assign(E, { job, coarse: [], fine: null, regions: [], duration: job.duration || 0,
                     view: { start: 0, end: job.duration || 1 }, cur: 0, playing: false,
                     loop: false, playEnd: 0, sel: -1, drag: null });
  $("#editor").hidden = false;
  $("#deck").hidden = true; $("#card").hidden = true; $("#dls").hidden = true;
  $("#edName").textContent = job.files[0] || job.title;
  $("#edNote").textContent = t().tracing; $("#edNote").hidden = false;
  $("#edTitles").value = "";
  renderEditor();
  window.scrollTo({ top: 0 });

  if (!edAudio) {
    edAudio = new Audio();
    edAudio.preload = "metadata";
    edAudio.addEventListener("timeupdate", () => { if (!E.drag) E.cur = edAudio.currentTime; });
    edAudio.addEventListener("play", () => { E.playing = true; renderEdBar(); tickWave(); });
    edAudio.addEventListener("pause", () => { E.playing = false; renderEdBar(); });
    edAudio.addEventListener("ended", () => { E.playing = false; renderEdBar(); });
  }
  edAudio.src = `/api/jobs/${job.id}/audio`;

  try {
    const d = await api(`/api/jobs/${job.id}/peaks`, {}, undefined, TIMEOUT.peaks);
    if (!editorOpen() || E.job?.id !== job.id) return;    // closed, or moved on
    E.coarse = d.peaks || [];
    E.duration = d.duration || E.duration;
    E.view = { start: 0, end: E.duration || 1 };
    if (d.name) $("#edName").textContent = d.name;
    $("#edNote").hidden = true;
    // a file downloaded with a tracklist opens with those passages already laid out;
    // otherwise it opens empty, because an empty wave is the invitation to drag
    E.regions = (job.marks || [])
      .filter(m => m.end > m.start)
      .map(m => ({ start: m.start, end: m.end, title: m.title || "" }));
    renderEditor();
  } catch (e) {
    if (aborted(e)) return;
    $("#edNote").textContent = t().err[errCode(e)] || t().err.generic;
    $("#edNote").hidden = false;
  }
}

function closeEditor() {
  if (edAudio) { edAudio.pause(); edAudio.removeAttribute("src"); edAudio.load(); }
  cancelAnimationFrame(edRaf);
  clearTimeout(fineTimer); fineCtl?.abort(); fineCtl = null;
  Object.assign(E, { job: null, coarse: [], fine: null, regions: [], playing: false,
                     loop: false, playEnd: 0, sel: -1, drag: null });
  $("#editor").hidden = true;
  $("#deck").hidden = false;
  renderCard(); renderJobs(true);
}

/* Playback stops where the selection stops. That is what makes the loop fast:
   hit play, hear exactly the passage you drew, adjust, hear it again. */
function guardEnd() {
  if (!E.playEnd || !edAudio || edAudio.paused) return;
  if (edAudio.currentTime >= E.playEnd - 0.02) {
    const g = E.regions[E.sel];
    if (E.loop && g) { try { edAudio.currentTime = g.start; } catch {} }
    else { edAudio.pause(); E.playEnd = 0; }
  }
}
function ensureVisible(t) {
  if (t < E.view.start || t > E.view.end) setView(t - viewSpan() * 0.3, viewSpan());
}
function tickWave() {
  cancelAnimationFrame(edRaf);
  const step = () => {
    if (!editorOpen()) return;
    // read the audio clock itself: timeupdate only fires about four times a
    // second, which zoomed in is a playhead that jumps instead of moving
    if (edAudio && !edAudio.paused) E.cur = edAudio.currentTime;
    guardEnd();
    if (E.playing) ensureVisible(E.cur);
    drawWave(); drawMini(); renderEdBar();
    if (E.playing) edRaf = requestAnimationFrame(step);
  };
  edRaf = requestAnimationFrame(step);
}

function playRegion(n) {
  const g = E.regions[n];
  if (!g || !edAudio) return;
  E.sel = n;
  E.playEnd = g.end;
  seekTo(g.start);
  ensureVisible(g.start);
  edAudio.play().catch(() => {});
  renderEdList();
}
function togglePlay() {
  if (!edAudio || !E.coarse.length) return;
  if (E.regions[E.sel]) { playRegion(E.sel); return; }   // space always restarts the passage
  E.playEnd = 0;
  edAudio.paused ? edAudio.play().catch(() => {}) : edAudio.pause();
}
function fitSelection() {
  const g = E.regions[E.sel];
  if (!g) return;
  const len = g.end - g.start, pad = Math.max(0.2, len * 0.25);
  setView(g.start - pad, len + pad * 2);
}

function fitCanvas(cv) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w) return null;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}

/* Ticks on a scale you can read: the step is picked so labels never crowd,
   whether the view spans two hours or two seconds. */
const TICK_STEPS = [0.1, 0.25, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600];
/* Zoomed in we need tenths, but a position stays a position: 21:28.5, never
   "1288.5s". Minutes do not stop existing because the window got small. */
function tickLabel(t, span) {
  if (span >= 10) return fmtClock(t);
  const m = Math.floor(t / 60), s = t - m * 60;
  return m ? `${m}:${s.toFixed(1).padStart(4, "0")}` : `${s.toFixed(1)}s`;
}
function drawRuler(ctx, w) {
  const span = viewSpan();
  const step = TICK_STEPS.find(s => span / s <= 9) || 3600;
  ctx.fillStyle = cssVar("--panel");
  ctx.fillRect(0, 0, w, RULER_H);
  ctx.font = `500 10px ${cssVar("--font")}`;
  ctx.textBaseline = "top";
  const first = Math.ceil(E.view.start / step) * step;
  for (let t = first; t <= E.view.end; t += step) {
    const x = ((t - E.view.start) / span) * w;
    ctx.fillStyle = cssVar("--line");
    ctx.fillRect(x, RULER_H - 5, 1, 5);
    ctx.fillStyle = cssVar("--faint");
    if (x < w - 38) ctx.fillText(tickLabel(t, span), x + 3, 3);
  }
}

function drawWave() {
  const c = fitCanvas($("#wave"));
  if (!c) return;
  const { ctx, w, h } = c;
  drawRuler(ctx, w);
  if (!E.coarse.length) return;
  const top = RULER_H, body = h - RULER_H, mid = top + body / 2, amp = body - 10;
  const span = viewSpan();
  const dim = cssVar("--seg"), lit = cssVar("--amber");
  const head = ((E.cur - E.view.start) / span) * w;
  for (let x = 0; x < w; x++) {
    const p = peakAt(E.view.start + (x / w) * span);
    const bh = Math.max(1, (p / 255) * amp);
    ctx.fillStyle = x <= head ? lit : dim;
    ctx.fillRect(x, mid - bh / 2, 1, bh);
  }
  const amber = cssVar("--amber"), hi = cssVar("--amber-hi");
  ctx.font = `700 11px ${cssVar("--font")}`;
  ctx.textBaseline = "top";
  E.regions.forEach((g, n) => {
    const x1 = ((g.start - E.view.start) / span) * w, x2 = ((g.end - E.view.start) / span) * w;
    if (x2 < -4 || x1 > w + 4) return;                 // off screen at this zoom
    const on = n === E.sel;
    ctx.globalAlpha = on ? 0.30 : 0.15;                // tints, never hides the wave
    ctx.fillStyle = amber;
    ctx.fillRect(x1, top, Math.max(2, x2 - x1), body);
    ctx.globalAlpha = 1;
    ctx.fillStyle = on ? hi : amber;                   // the handles are what you grab
    ctx.fillRect(x1, top, on ? 3 : 2, body);
    ctx.fillRect(x2 - (on ? 3 : 2), top, on ? 3 : 2, body);
    if (x2 - x1 > 24) {
      ctx.fillStyle = cssVar("--on-amber");
      ctx.fillRect(x1 + (on ? 3 : 2), top, 19, 15);
      ctx.fillStyle = on ? hi : amber;
      ctx.fillText(String(n + 1).padStart(2, "0"), x1 + (on ? 7 : 6), top + 3);
    }
  });
  ctx.fillStyle = cssVar("--err");
  ctx.fillRect(head - 1, 0, 2, h);
}

/* The whole file at a glance, with a box showing what the big view is on.
   Without it, zooming in is how you get lost. */
function drawMini() {
  const c = fitCanvas($("#mini"));
  if (!c || !E.coarse.length || !E.duration) return;
  const { ctx, w, h } = c;
  const mid = h / 2, amp = h - 6;
  ctx.fillStyle = cssVar("--seg");
  for (let x = 0; x < w; x++) {
    const i = Math.min(E.coarse.length - 1, Math.floor((x / w) * E.coarse.length));
    const bh = Math.max(1, ((E.coarse[i] || 0) / 255) * amp);
    ctx.fillRect(x, mid - bh / 2, 1, bh);
  }
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = cssVar("--amber");
  E.regions.forEach(g => {
    const x1 = (g.start / E.duration) * w;
    ctx.fillRect(x1, 0, Math.max(1, ((g.end - g.start) / E.duration) * w), h);
  });
  ctx.globalAlpha = 1;
  const vx = (E.view.start / E.duration) * w, vw = Math.max(3, (viewSpan() / E.duration) * w);
  ctx.strokeStyle = cssVar("--text");
  ctx.lineWidth = 1;
  ctx.strokeRect(vx + 0.5, 0.5, Math.min(vw, w - vx - 1), h - 1);
  ctx.fillStyle = cssVar("--err");
  ctx.fillRect((E.cur / E.duration) * w, 0, 1, h);
}

function renderEdBar() {
  $("#edPlay").innerHTML = icon(E.playing ? "pause" : "play");
  const loop = $("#edLoop");
  loop.innerHTML = icon("rotate-ccw");
  loop.setAttribute("aria-pressed", String(E.loop));
  loop.style.color = E.loop ? cssVar("--amber") : "";
  $("#edOut").innerHTML = icon("minus");
  $("#edIn").innerHTML = icon("plus");
  // tenths once zoomed in, because that is the precision you are working at
  $("#edTime").textContent = `${tickLabel(E.cur, viewSpan())} / ${fmtClock(E.duration)}`;
  const z = E.duration ? E.duration / viewSpan() : 1;
  $("#edZoom").textContent = z > 1.05 ? `×${z < 10 ? z.toFixed(1) : Math.round(z)}` : "";
  const btn = $("#edExport");
  btn.innerHTML = `${icon("scissors")}<span>${esc(t().exportN(E.regions.length))}</span>`;
  btn.disabled = !E.regions.length || !E.coarse.length;
}

function renderEdList() {
  const box = $("#edList");
  if (!E.regions.length) {
    box.innerHTML = `<p class="row-label" style="margin:0">${esc(t().noRegions)}</p>`;
    return;
  }
  box.innerHTML = E.regions.map((g, n) => `
    <div class="ed-row${n === E.sel ? " on" : ""}" data-mark="${n}">
      <span class="eno">${String(n + 1).padStart(3, "0")}</span>
      <button type="button" class="icon-btn" data-mark-act="play" title="${esc(t().playFrom)}" aria-label="${esc(t().playFrom)}">${icon("play")}</button>
      <input type="text" value="${esc(g.title)}" placeholder="${esc(t().trackName)}" data-mark-name aria-label="${esc(t().trackName)}">
      <span class="acts"><span class="ets">${esc(spanLabel(g))}</span><span class="edur">${esc(lenLabel(g))}</span>
        <button type="button" class="icon-btn" data-mark-act="del" title="${esc(t().removeMark)}" aria-label="${esc(t().removeMark)}">${icon("x")}</button></span>
    </div>`).join("");
}
const spanLabel = g => `${fmtClock(g.start)} – ${fmtClock(g.end)}`;
// the length matters as much as the position when you are pulling out a one-shot
const lenLabel = g => { const d = g.end - g.start; return d < 10 ? `${d.toFixed(1)}s` : fmtClock(d); };

/* Called on every pointer move while dragging: rewriting the whole list there
   would throw away the caret of whatever name is being typed. */
function renderEdTimes() {
  $("#edList").querySelectorAll("[data-mark]").forEach(row => {
    const g = E.regions[Number(row.dataset.mark)];
    const cell = row.querySelector(".ets");
    if (g && cell) cell.textContent = spanLabel(g);
  });
}

function renderEditor() { drawWave(); drawMini(); renderEdBar(); renderEdList(); }

function seekTo(s) {
  E.cur = Math.max(0, Math.min(s, E.duration || s));
  if (edAudio) { try { edAudio.currentTime = E.cur; } catch {} }
  drawWave(); renderEdBar();
}

const waveEl = $("#wave"), miniEl = $("#mini");
const MIN_SPAN = 0.15, EDGE_PX = 7, DRAG_PX = 4;
const xToTime = x => {
  const r = waveEl.getBoundingClientRect();
  if (!r.width) return 0;
  const t = E.view.start + ((x - r.left) / r.width) * viewSpan();
  return Math.max(0, Math.min(t, E.duration || t));
};
const centerX = () => { const r = waveEl.getBoundingClientRect(); return r.left + r.width / 2; };

/* What sits under the pointer: an edge to resize, a body to move, or bare wave
   where a drag starts a new selection. Later regions win, so the one you just
   drew stays reachable when they overlap. */
function hitTest(clientX) {
  const r = waveEl.getBoundingClientRect();
  const px = s => r.left + ((s - E.view.start) / viewSpan()) * r.width;
  for (let n = E.regions.length - 1; n >= 0; n--) {
    const g = E.regions[n];
    if (Math.abs(px(g.start) - clientX) <= EDGE_PX) return { mode: "edgeL", idx: n };
    if (Math.abs(px(g.end) - clientX) <= EDGE_PX) return { mode: "edgeR", idx: n };
  }
  for (let n = E.regions.length - 1; n >= 0; n--) {
    const g = E.regions[n];
    if (clientX > px(g.start) && clientX < px(g.end)) return { mode: "inside", idx: n };
  }
  return { mode: "empty", idx: -1 };
}

waveEl.addEventListener("pointerdown", e => {
  if (!E.coarse.length) return;
  const r = waveEl.getBoundingClientRect();
  try { waveEl.setPointerCapture(e.pointerId); } catch {}
  if (e.clientY - r.top < RULER_H) {              // the ruler scrubs
    E.drag = { mode: "scrub", startX: e.clientX, moved: true, idx: -1 };
    seekTo(xToTime(e.clientX));
    return;
  }
  if (e.button === 1 || e.shiftKey) {             // shift-drag slides the view
    E.drag = { mode: "pan", startX: e.clientX, startView: E.view.start, moved: false, idx: -1 };
    $("#waveBox").classList.add("panning");
    return;
  }
  const hit = hitTest(e.clientX);
  E.drag = { ...hit, startX: e.clientX, startT: xToTime(e.clientX), moved: false,
             orig: hit.idx >= 0 ? { ...E.regions[hit.idx] } : null };
  if (hit.idx >= 0) { E.sel = hit.idx; renderEdList(); }
  $("#waveBox").classList.add(hit.mode === "inside" ? "moving" : "resizing");
  drawWave();
});

waveEl.addEventListener("pointermove", e => {
  const d = E.drag;
  if (!d) return;
  if (d.mode === "scrub") { seekTo(xToTime(e.clientX)); return; }
  if (d.mode === "pan") {
    const r = waveEl.getBoundingClientRect();
    setView(d.startView - ((e.clientX - d.startX) / r.width) * viewSpan(), viewSpan());
    return;
  }
  if (!d.moved && Math.abs(e.clientX - d.startX) < DRAG_PX) return;   // a click is not a drag
  d.moved = true;
  const at = xToTime(e.clientX);
  if (d.mode === "empty") {               // first movement on bare wave: born here
    E.regions.push({ start: Math.min(d.startT, at), end: Math.max(d.startT, at), title: "" });
    d.idx = E.regions.length - 1;
    d.mode = "drawing";
    E.sel = d.idx;
    renderEdList();
  }
  const g = E.regions[d.idx];
  if (!g) return;
  if (d.mode === "drawing") {
    g.start = Math.min(d.startT, at);
    g.end = Math.max(d.startT, at);
  } else if (d.mode === "edgeL") {
    g.start = Math.min(at, g.end - MIN_SPAN);
  } else if (d.mode === "edgeR") {
    g.end = Math.max(at, g.start + MIN_SPAN);
  } else if (d.mode === "inside") {
    const len = d.orig.end - d.orig.start;
    g.start = Math.max(0, Math.min(d.orig.start + (at - d.startT), (E.duration || len) - len));
    g.end = g.start + len;
  }
  drawWave(); renderEdTimes();
});

function endDrag(e) {
  const d = E.drag;
  if (!d) return;
  E.drag = null;
  try { waveEl.releasePointerCapture(e.pointerId); } catch {}
  $("#waveBox").classList.remove("moving", "resizing", "panning");
  if (d.mode === "scrub" || d.mode === "pan") return;
  if (!d.moved) {                         // a plain click: listen from there
    E.sel = d.idx;
    E.playEnd = 0;
    seekTo(d.startT);
    renderEdList();
    return;
  }
  const kept = E.regions[d.idx];
  E.regions = E.regions.filter(g => g.end - g.start >= MIN_SPAN);   // drop the accidental flicks
  E.regions.sort((a, b) => a.start - b.start);
  E.sel = E.regions.indexOf(kept);
  renderEditor();
}
waveEl.addEventListener("pointerup", endDrag);
waveEl.addEventListener("pointercancel", endDrag);

waveEl.addEventListener("wheel", e => {
  if (!E.duration || !E.coarse.length) return;
  e.preventDefault();
  if (e.shiftKey) setView(E.view.start + (e.deltaY > 0 ? 0.18 : -0.18) * viewSpan(), viewSpan());
  else zoomAt(e.clientX, e.deltaY < 0 ? 1.3 : 1 / 1.3);     // zoom holds the point under the cursor
}, { passive: false });

/* The overview is the fastest way back: click anywhere on the whole file and
   the detailed view jumps there. */
let miniDrag = false;
function miniTo(clientX) {
  const r = miniEl.getBoundingClientRect();
  if (!r.width || !E.duration) return;
  setView(((clientX - r.left) / r.width) * E.duration - viewSpan() / 2, viewSpan());
}
miniEl.addEventListener("pointerdown", e => {
  if (!E.coarse.length) return;
  miniDrag = true;
  try { miniEl.setPointerCapture(e.pointerId); } catch {}
  miniTo(e.clientX);
});
miniEl.addEventListener("pointermove", e => { if (miniDrag) miniTo(e.clientX); });
function endMini(e) {
  miniDrag = false;
  try { miniEl.releasePointerCapture(e.pointerId); } catch {}
}
miniEl.addEventListener("pointerup", endMini);
miniEl.addEventListener("pointercancel", endMini);

$("#edIn").addEventListener("click", () => zoomAt(centerX(), 1.5));
$("#edOut").addEventListener("click", () => zoomAt(centerX(), 1 / 1.5));
$("#edFit").addEventListener("click", fitSelection);
$("#edAll").addEventListener("click", () => setView(0, E.duration));
$("#edLoop").addEventListener("click", () => { E.loop = !E.loop; renderEdBar(); });

$("#edBack").addEventListener("click", closeEditor);
// the button pauses and resumes; space is the one that restarts the passage
$("#edPlay").addEventListener("click", () => {
  if (!edAudio || !E.coarse.length) return;
  if (!edAudio.paused) { edAudio.pause(); return; }
  if (E.regions[E.sel]) playRegion(E.sel);
  else { E.playEnd = 0; edAudio.play().catch(() => {}); }
});
$("#edList").addEventListener("click", e => {
  const row = e.target.closest("[data-mark]"); if (!row) return;
  const n = Number(row.dataset.mark);
  const act = e.target.closest("[data-mark-act]")?.dataset.markAct;
  if (act === "del") { E.regions.splice(n, 1); E.sel = -1; renderEditor(); return; }
  if (act === "play") { playRegion(n); renderEditor(); return; }
  // clicking the field itself must not rebuild the list, or the caret is lost
  if (e.target.matches("[data-mark-name]")) { E.sel = n; drawWave(); return; }
  E.sel = n; renderEditor();
});
$("#edList").addEventListener("input", e => {
  const row = e.target.closest("[data-mark]");
  if (row && e.target.matches("[data-mark-name]")) E.regions[Number(row.dataset.mark)].title = e.target.value;
});

/* For the case where an artist lists the titles but no timecodes: paste the
   names, place the cuts by ear, and the two meet in the middle. */
$("#edApplyTitles").addEventListener("click", () => {
  const lines = $("#edTitles").value.split(/\r?\n/).map(s => s.trim().replace(/^\d{1,3}\s*[.)\-–]\s*/, "")).filter(Boolean);
  if (!lines.length) return;
  lines.forEach((line, n) => { if (E.regions[n]) E.regions[n].title = line; });
  renderEditor();
});

$("#edExport").addEventListener("click", async () => {
  const job = E.job;
  if (!job || !E.regions.length) return;
  // each selection stands alone: what lies between them is simply not exported
  const marks = [...E.regions]
    .sort((a, b) => a.start - b.start)
    .map(g => ({ start: Math.round(g.start), end: Math.round(g.end), title: g.title || "" }))
    .filter(m => m.end > m.start);
  if (!marks.length) return;
  const btn = $("#edExport");
  btn.disabled = true;
  try {
    await api(`/api/jobs/${job.id}/split`, { marks });
    closeEditor(); schedulePoll(200); clearActionError();
  } catch (e) {
    if (!aborted(e)) showActionError(e);
    btn.disabled = false;
  }
});

window.addEventListener("resize", () => { if (editorOpen()) drawWave(); });
document.addEventListener("keydown", e => {
  if (!editorOpen() || e.target.matches("input,textarea,summary")) return;
  const g = E.regions[E.sel], k = e.key;
  const stop = () => e.preventDefault();
  if (k === " ") { stop(); togglePlay(); }
  else if (k === "l" || k === "L") { stop(); E.loop = !E.loop; renderEdBar(); }
  // the ear finishing what the drag roughed out
  else if (k === "[" && g) { stop(); g.start = Math.min(E.cur, g.end - MIN_SPAN); renderEditor(); }
  else if (k === "]" && g) { stop(); g.end = Math.max(E.cur, g.start + MIN_SPAN); renderEditor(); }
  else if ((k === "Delete" || k === "Backspace") && g) { stop(); E.regions.splice(E.sel, 1); E.sel = -1; renderEditor(); }
  else if (k === "Enter" && g) { stop(); $(`[data-mark="${E.sel}"] [data-mark-name]`)?.focus(); }
  else if (k === "Escape") { E.sel = -1; E.playEnd = 0; renderEditor(); }
  else if (k === "f" || k === "F") { stop(); fitSelection(); }
  else if (k === "0") { stop(); setView(0, E.duration); }
  else if (k === "+" || k === "=") { stop(); zoomAt(centerX(), 1.5); }
  else if (k === "-" || k === "_") { stop(); zoomAt(centerX(), 1 / 1.5); }
  else if (k === "ArrowLeft") { stop(); seekTo(E.cur - (e.shiftKey ? 0.2 : 2)); }
  else if (k === "ArrowRight") { stop(); seekTo(E.cur + (e.shiftKey ? 0.2 : 2)); }
});

/* ───────── boot ───────── */
async function loadState() {
  try {
    const d = await api("/api/state");
    S.folder = d.folder; S.jobs = d.jobs; S.engine = d.engine || {};
    if (d.destinations) S.dests = d.destinations;
    S.keepAlive = !!d.keepAlive;
    renderJobs(); renderEngine(); if (S.info) renderOptions();
  } catch (e) {
    // not fatal: poll() is what reports a dead server, but a silent failure here
    // left the folder path blank with no explanation at all
    if (!aborted(e)) console.error("could not load state", e);
  }
}
applyLang();
loadState().then(() => schedulePoll(600));
urlInput.focus();
</script>
</body>
</html>

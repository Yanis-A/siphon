<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Siphon</title>
<style>
:root{
  --ink:#181B22; --panel:#20242D; --raised:#292E39; --line:#343A48;
  --text:#ECEEF2; --muted:#9097A7; --faint:#868D9C;
  --amber:#F4B740; --amber-hi:#FFD27A; --on-amber:#1A1B20; --err:#FF7B6E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;width:320px;background:var(--ink);color:var(--text);
     font:400 13.5px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:5px}

.head{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
.mark{width:22px;height:22px;border-radius:6px;background:var(--amber);display:grid;place-items:center;flex:none}
.mark svg{width:14px;height:14px}
.word{font-weight:800;font-size:15px;letter-spacing:.01em}
.head .sp{flex:1}
.openapp{font-size:12px;color:var(--muted);padding:3px 6px;border-radius:5px}
.openapp:hover{color:var(--text);background:var(--raised)}

.body{padding:0 14px 14px}
.target{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:12px}
.ttitle{font-weight:600;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.thost{color:var(--faint);font-size:11.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.lbl{font-size:11.5px;color:var(--faint);margin:0 0 6px}
.dests{display:flex;flex-wrap:wrap;gap:6px}
.dest{display:flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid var(--line);
      border-radius:8px;font-size:13px;font-weight:600;flex:1 1 calc(50% - 3px);min-width:0}
.dest:hover:not(:disabled){border-color:var(--amber);background:var(--raised)}
.dest .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dest .f{font-size:10.5px;font-weight:500;color:var(--faint);margin-left:auto;flex:none}

.msg{font-size:12.5px;color:var(--muted);padding:10px 0}
.msg.err{color:var(--err)}
.msg strong{display:block;color:var(--text);font-size:13px;margin-bottom:3px}

.jobs{margin-top:12px;display:grid;gap:7px}
.job{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.jt{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.js{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:8px}
.job.error .js{color:var(--err)}
.bar{height:4px;background:var(--raised);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .3s linear}
.flash{animation:fl 1s ease-out}
@keyframes fl{from{border-color:var(--amber)}to{border-color:var(--line)}}
</style>
</head>
<body>
  <div class="head">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#18191F" stroke-width="2.6"
      stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></svg></span>
    <span class="word">Siphon</span>
    <span class="sp"></span>
    <button class="openapp" id="open" type="button"></button>
  </div>
  <div class="body">
    <div class="target" id="target" hidden>
      <div class="ttitle" id="ttitle"></div>
      <div class="thost" id="thost"></div>
    </div>
    <p class="lbl" id="destLabel" hidden></p>
    <div class="dests" id="dests"></div>
    <div class="msg" id="msg" hidden></div>
    <div class="jobs" id="jobs"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
